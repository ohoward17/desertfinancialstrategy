  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #0D1F3C;
    --navy-mid: #162D52;
    --navy-light: #1E3F70;
    --teal: #0E7A8B;
    --teal-light: #13A3BA;
    --teal-glow: rgba(14,122,139,0.18);
    --gold: #C8A84B;
    --gold-light: #E2C97A;
    --slate: #8A9BB5;
    --slate-light: #B8C6D8;
    --bg-base: #070F1D;
    --bg-card: #0F1C30;
    --bg-raised: #152234;
    --bg-hover: #1A2A40;
    --border: rgba(138,155,181,0.15);
    --border-accent: rgba(14,122,139,0.4);
    --text-primary: #E8EDF4;
    --text-secondary: #8A9BB5;
    --text-muted: #4A5A72;
    --green: #22C55E;
    --red: #EF4444;
    --amber: #F59E0B;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'IBM Plex Sans', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --radius: 6px;
    --radius-lg: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --shadow-glow: 0 0 30px rgba(14,122,139,0.12);
  }

  body { background: var(--bg-base); color: var(--text-primary); font-family: var(--font-body); }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg-base); }
  ::-webkit-scrollbar-thumb { background: var(--navy-light); border-radius: 2px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  @keyframes shimmer {
    0% { background-position: -200% center; }
    100% { background-position: 200% center; }
  }
  @keyframes typing { from { width: 0; } to { width: 100%; } }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  .fade-in { animation: fadeIn 0.35s ease both; }
  .slide-in { animation: slideIn 0.3s ease both; }

  input, textarea { font-family: var(--font-body); }
  button { cursor: pointer; font-family: var(--font-body); }
  table { border-collapse: collapse; width: 100%; }

ssets:11739.5,avgAssets:11365.6,roa:1.16,floor:.95,nwr:12.83,headroom:24,giving:5.4,giveback:18,partnerCards:24e3,members:606082},{year:2029,assets:12532,avgAssets:12135.8,roa:1.2,floor:.95,nwr:13.18,headroom:30.2,giving:5.5,giveback:18,partnerCards:25e3,members:645477},{year:2030,assets:13373.4,avgAssets:12952.7,roa:1.24,floor:.95,nwr:13.55,headroom:37.6,giving:5.7,giveback:20,partnerCards:26e3,members:687433}],minHeadroom:24};var Eo={nim:`Desert Financial's net interest margin is **3.19%** year to date through June 30, 2026 (excluding the Member Giveback Bonus), up from 2.82% for FY2025, an improvement of **37 basis points**.

The main driver is funding cost. Cost of funds fell from 1.83% in FY2025 to 1.51% in H1 2026 as certificates rolled into lower rates after the Fed cuts, while the loan book kept earning about 6.3%.

Key contributing factors:
\u2022 Loans grew 15.1% year over year to $5.31B, redeploying low-yielding securities runoff
\u2022 No borrowed funds outstanding (FY2024 borrowing cost was $16.5M; FY2025 was $4.9M)
\u2022 $1.34B of certificates mature in the next 12 months at about 3.8%, which gives room to reprice lower

On the NCUA basis, which counts the $16M giveback paid in February as dividends, NIM is 2.86%. The industry aggregate is 3.49% and the illustrative $5B to $20B peer median is 3.30%.`,nii:`Under the DFCU ALM model as of June 30, 2026, Year 1 NII sensitivity (constant balance sheet, instantaneous shocks) is:

| Scenario | Year 1 NII | Change | Policy limit |
|---|---|---|---|
| -300bp | $291.4M | -$36.1M (-11.0%) | -20% max |
| -200bp | $304.0M | -$23.5M (-7.2%) | -15% max |
| -100bp | $316.7M | -$10.8M (-3.3%) | -10% max |
| Base (flat) | $327.5M | \u2014 | \u2014 |
| +100bp | $332.0M | +$4.5M (+1.4%) | -10% max |
| +200bp | $334.9M | +$7.3M (+2.2%) | -15% max |
| +300bp | $336.7M | +$9.1M (+2.8%) | -20% max |

**Interpretation:** DFCU is **asset-sensitive** in Year 1. About $1.7B of HELOCs, commercial floaters and personal lines reprice with prime, and cash earns overnight rates, while checking and savings carry betas of only 2% to 5%. The larger earnings risk is **falling rates**: -300bp cuts Year 1 NII by 11.0%, and Year 2 by 14.3% against a 25% limit. All scenarios are within the (hypothetical) board limits.`,capital:`Desert Financial's net worth ratio is **12.10%** at June 30, 2026 (four-quarter average method, as reported), well above the 9% complex credit union leverage ratio threshold for well capitalized and the 11% board target (hypothetical).

Key capital metrics:
\u2022 Net worth: $1,161.6M (undivided earnings plus H1 2026 net income of $54.8M)
\u2022 AOCI: -$253.8M, which is 21.8% of net worth (policy max 30%)
\u2022 Quarter-end basis NWR: 11.75%
\u2022 Member business loans at 71.7% of the statutory cap
