  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  @media (max-width: 820px) {
    .app-shell { flex-direction: column !important; }
    .app-nav { position: static !important; width: 100% !important; min-height: 0 !important; border-right: none !important; border-bottom: 1px solid var(--border); flex-direction: row !important; flex-wrap: wrap; align-items: center; }
    .app-nav-logo { border-bottom: none !important; padding: 12px 14px !important; }
    .app-nav-date, .app-nav-foot { display: none !important; }
    .app-nav-items { display: flex; flex: 1 1 100% !important; overflow-x: auto; padding: 4px 10px 10px !important; gap: 4px; }
    .app-nav-items button { width: auto !important; white-space: nowrap; margin-bottom: 0 !important; }
    .app-main { margin-left: 0 !important; padding: 18px 14px !important; min-width: 0; }
  }

  :root {
    --navy: #0D1F3C;
    --navy-mid: #162D52;
    --navy-light: #1E3F70;
    --teal: #0E7A8B;
    --teal-light: #13A3BA;
    --teal-glow: rgba(14,122,139,0.18);
    --gold: #C8A84B;
    --gold-light: #E2C97A;
    --slate: #8A9BB5;
    --slate-light: #B8C6D8;
    --bg-base: #070F1D;
    --bg-card: #0F1C30;
    --bg-raised: #152234;
    --bg-hover: #1A2A40;
    --border: rgba(138,155,181,0.15);
    --border-accent: rgba(14,122,139,0.4);
    --text-primary: #E8EDF4;
    --text-secondary: #8A9BB5;
    --text-muted: #4A5A72;
    --green: #22C55E;
    --red: #EF4444;
    --amber: #F59E0B;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'IBM Plex Sans', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --radius: 6px;
    --radius-lg: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --shadow-glow: 0 0 30px rgba(14,122,139,0.12);
  }

  body { background: var(--bg-base); color: var(--text-primary); font-family: var(--font-body); }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg-base); }
  ::-webkit-scrollbar-thumb { background: var(--navy-light); border-radius: 2px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  @keyframes shimmer {
    0% { background-position: -200% center; }
    100% { background-position: 200% center; }
  }
  @keyframes typing { from { width: 0; } to { width: 100%; } }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  .fade-in { animation: fadeIn 0.35s ease both; }
  .slide-in { animation: slideIn 0.3s ease both; }

  input, textarea { font-family: var(--font-body); }
  button { cursor: pointer; font-family: var(--font-body); }
  table { border-collapse: collapse; width: 100%; }
